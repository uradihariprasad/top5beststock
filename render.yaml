# Render Blueprint - Infrastructure as Code
# Deploy with: https://render.com/deploy

services:
  # Next.js Web Application
  - type: web
    name: fno-momentum-scanner
    runtime: node
    region: singapore  # Change to your preferred region
    plan: starter  # Or 'free' for testing
    buildCommand: npm install && npm run build && npx drizzle-kit push
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fno-scanner-db
          property: connectionString
      # Optional: Add your Upstox credentials as env vars
      # - key: UPSTOX_API_KEY
      #   sync: false
      # - key: UPSTOX_API_SECRET
      #   sync: false
    healthCheckPath: /api/health
    autoDeploy: true

databases:
  # PostgreSQL Database
  - name: fno-scanner-db
    plan: starter  # Or 'free' for testing
    region: singapore
    databaseName: fno_scanner
    user: fno_user
